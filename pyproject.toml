[project]
name = "open-deep-think"
version = "0.1.0"
description = "Open Deep Think project"
authors = [
    { name = "dvmazur" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets==4.5.0",
    "openai>=1.0.0",
    "requests==2.32.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
target-version = "py39"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs`
    "D107",   # Missing docstring in `__init__`
    "FIX002", # Line contains TODO, consider resolving the issue
    "COM812", # Conflicts with formatter
    "ISC001", # Conflicts with formatter
]
per-file-ignores = { "tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
